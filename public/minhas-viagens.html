<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Triply | Minhas Viagens</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="icon" type="image/png" href="assets/imgs/triply-icon.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body class="minhas-viagens">
    <div class="pagina-viagens">

        <!-- Menu lateral esquedo -->
        <div class="menu-lateral">
            <div class="menu">
                <a href="index.html" class="logo">
                    <img src="./assets/imgs/logo.png" alt="Triply">
                </a>

                <!-- coloca "selecionado" a opção de minhas viagens (a pagina atual)-->
                <a href="minhas-viagens.html" class="ativo">Minhas viagens</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="nova-viagem.html">Adicionar viagem</a>
            </div>
            <a href="login.html" class="sair-menu">Sair</a>

        </div>

        <!-- Conteúdo da páginha -->
        <div class="conteudo-viagens">

            <div class="cabecalho-viagens">
                <div class="textos-viagens">
                    <h6>SEU MUNDO DE VIAGENS</h6>
                    <h1>Cada destino guarda uma nova história</h1>
                    <p>Reúna seus planos e revisite todas as viagens em um só lugar.</p>
                </div>
                <a href="nova-viagem.html" class="botao-nova-viagem">
                    + Nova viagem
                </a>
            </div>

            <!-- Viagens cadastradas -->
            <div class="lista-viagens" id="lista_viagens">
            </div>
        </div>

    </div>

    <script>
        function carregarViagens() {

            /* essa parte identifica o usuario logado */
            let idUsuario = sessionStorage.ID_USUARIO;

            /* busca as viagens */
            fetch(`/viagens/listar/${idUsuario}`)
                /* busca os dados da viagem */
                .then(function (resposta) {
                    return resposta.json();
                })
                .then(function (viagens) {

                    /* percorre as viagens encontradas */
                    for (let i = 0; i < viagens.length; i++) {

                        lista_viagens.innerHTML += `
                            <div class="card-viagem">
                                <h3>${viagens[i].titulo}</h3>
                                <p>Destino: ${viagens[i].destino}</p>
                                <p>Status: ${viagens[i].status}</p>
                                <p>Orçamento: R$ ${viagens[i].orcamento}</p>
                            </div>
                        `;
                    }

                    if (viagens.length == 0) {
                        lista_viagens.innerHTML = "<p>Você ainda não cadastrou nenhuma viagem.</p>";
                    }

                })
                /* mostra os erros */
                .catch(function (erro) {
                    console.log("Erro ao carregar viagens:", erro);
                });

        }

        carregarViagens();

    </script>

</body>

</html>
